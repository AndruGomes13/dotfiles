# --- CLI tools, installed to ~/.local/share/mise (btop on macOS comes from the Brewfile) ---
[tools]
atuin = { version = "latest", os = ["macos"] }
# The musl build has no glibc dependency, so it also runs on older Linux (e.g. Ubuntu 22.04)
"github:atuinsh/atuin" = { version = "latest", os = ["linux"], matching = "musl" }
bat = "latest"
btop = { version = "latest", os = ["linux"] }
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
lazydocker = "latest"
lazygit = "latest"
neovim = "latest"
ripgrep = "latest"
starship = "latest"
tealdeer = "latest"
tmux = "latest"
tree-sitter = "latest"
zoxide = "latest"
