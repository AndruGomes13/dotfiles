gui:
  nerdFontsVersion: "3"
  # --- Gruvbox Dark ---
  theme:
    activeBorderColor: ["#d65d0e", bold]
    inactiveBorderColor: ["#928374"]
    searchingActiveBorderColor: ["#d79921", bold]
    optionsTextColor: ["#458588"]
    selectedLineBgColor: ["#3c3836"]
    inactiveViewSelectedLineBgColor: ["#3c3836"]
    cherryPickedCommitFgColor: ["#b16286"]
    cherryPickedCommitBgColor: ["#3c3836"]
    markedBaseCommitFgColor: ["#458588"]
    markedBaseCommitBgColor: ["#d79921"]
    unstagedChangesColor: ["#cc241d"]
    defaultFgColor: ["#ebdbb2"]
git:
  # --- delta for diffs ---
  diffRenderers:
    - command: delta --dark --paging=never
