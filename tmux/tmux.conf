# --- Terminal: true color and undercurl ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle,xterm-256color:RGB:usstyle,tmux-256color:RGB:usstyle"

# --- Prefix: Ctrl-a or Ctrl-Space (press twice to send it to the app) ---
unbind C-b
set -g prefix C-a
set -g prefix2 C-Space
bind C-a send-prefix
bind C-Space send-prefix -2

# --- General ---
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string "#S: #W"
set -g display-time 2000
set -g mode-keys vi

# --- Splits and windows open in the current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Resize panes with H/J/K/L or Option+arrows ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r M-Left resize-pane -L 5
bind -r M-Down resize-pane -D 5
bind -r M-Up resize-pane -U 5
bind -r M-Right resize-pane -R 5

# --- Clear screen with prefix Ctrl-l (plain Ctrl-l moves to the right pane) ---
bind C-l send-keys C-l

# --- Copy mode: v selects, y copies ---
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Theme: Catppuccin Mocha, transparent status bar on top ---
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#a6adc8"
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#1e1e2e#,bg=#f38ba8],#[fg=#cba6f7#,bg=default]}#[bold]  #S #[default] "
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086]  #I #W#{?window_zoomed_flag, 󰊓,}  "
set -g window-status-current-format "#[fg=#cba6f7]#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#cba6f7,bg=default,nobold]"
set -g status-right-length 60
set -g status-right "#[fg=#a6adc8]󰒋 #h #[fg=#45475a]│#[fg=#a6adc8] %H:%M "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=default,fg=#cba6f7"
set -g message-command-style "bg=default,fg=#cba6f7"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g clock-mode-colour "#cba6f7"

# --- Plugins: vim-tmux-navigator, session save/restore (resurrect + continuum) ---
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

# --- Install tpm and plugins on first run, then load them ---
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone -q --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run "~/.tmux/plugins/tpm/tpm"
